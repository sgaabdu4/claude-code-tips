name: ci

on:
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'hooks/**'
      - 'bin/**'
      - 'tests/**'
      - 'settings/**'
      - 'commands/**'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:

jobs:
  stack:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Environment
        run: |
          echo "uname:    $(uname)"
          echo "uname -m: $(uname -m)"
          echo "bash:     $BASH_VERSION"
          for t in git curl jq python3 unzip node npm brew; do
            printf '%-8s %s\n' "$t" "$(command -v "$t" || echo MISSING)"
          done

      - name: install.sh --check
        run: ./install.sh --check

      - name: test suite
        run: ./tests/run-cli-hook.test.sh

      - name: cleanup-rtk-artifacts (report only)
        run: ./bin/cleanup-rtk-artifacts.sh

      # Windows binaries carry a .exe suffix the resolver never appends. MSYS
      # path emulation covers it, but the whole point is not to assume.
      - name: run-cli-hook resolves an .exe
        if: runner.os == 'Windows'
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/bash\necho ran-stub\n' > "$HOME/.local/bin/cct-probe.exe"
          chmod +x "$HOME/.local/bin/cct-probe.exe"
          ./hooks/run-cli-hook --which cct-probe

      - name: full install (no shell wrapper)
        run: ./install.sh --no-shell-wrapper --no-caveman

      - name: installed components really landed
        run: |
          fail=0
          for b in rtk codebase-memory-mcp; do
            if p=$(./hooks/run-cli-hook --which "$b"); then
              echo "  ok   - $b → $p"
            else
              echo "  FAIL - $b not resolvable after install"; fail=1
            fi
          done
          # Guards the class of bug where the summary ticks something absent.
          exit $fail

      - name: post-install --check
        run: ./install.sh --check

      # Open question from the README: a native Windows Claude Code is a Node
      # process, and Node's shell-form spawn uses ComSpec (cmd.exe), which
      # cannot execute an extensionless shebang script. Probe each candidate
      # spawn path against the hook we actually installed. Diagnostic for now;
      # becomes an assertion once the answer is known.
      - name: hook spawn probe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hook = "$env:USERPROFILE\.claude\hooks\run-cli-hook"
          $gitbash = "C:\Program Files\Git\bin\bash.exe"
          Write-Host "hook:     $hook (exists: $(Test-Path $hook))"
          Write-Host "git bash: $gitbash (exists: $(Test-Path $gitbash))"

          function Probe($label, $block) {
            Write-Host "`n--- $label"
            try {
              $out = & $block 2>&1 | Out-String
              Write-Host "exit=$LASTEXITCODE out=$($out.Trim())"
            } catch {
              Write-Host "threw: $($_.Exception.Message)"
            }
          }

          Write-Host "`nbash on cmd PATH: $(cmd.exe /c 'where bash 2>nul' | Out-String)"

          # Round 1 established that a bare hook path dies under cmd.exe and
          # runs under Git Bash. We do not control which one Claude Code picks,
          # so find a single command string that survives both.
          $hookFwd = $hook -replace '\\','/'
          $candidates = @(
            @{ n = 'A backslash abs bash + backslash hook'; c = "`"$gitbash`" `"$hook`" --which rtk" },
            @{ n = 'B forward-slash abs bash + fwd hook';   c = "`"$($gitbash -replace '\\','/')`" `"$hookFwd`" --which rtk" },
            @{ n = 'C bare bash + fwd hook';                c = "bash `"$hookFwd`" --which rtk" },
            @{ n = 'D backslash abs bash + fwd hook';       c = "`"$gitbash`" `"$hookFwd`" --which rtk" }
          )
          foreach ($cand in $candidates) {
            Probe "$($cand.n) :: under cmd.exe" { cmd.exe /c $cand.c }
            Probe "$($cand.n) :: under git bash" { & $gitbash -c $cand.c }
          }
