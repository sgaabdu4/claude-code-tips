name: ci

on:
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'hooks/**'
      - 'bin/**'
      - 'tests/**'
      - 'settings/**'
      - 'commands/**'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:

jobs:
  stack:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Environment
        run: |
          echo "uname:    $(uname)"
          echo "uname -m: $(uname -m)"
          echo "bash:     $BASH_VERSION"
          for t in git curl jq python3 unzip node npm brew; do
            printf '%-8s %s\n' "$t" "$(command -v "$t" || echo MISSING)"
          done

      - name: install.sh --check
        run: ./install.sh --check

      - name: test suite
        run: ./tests/run-cli-hook.test.sh

      - name: cleanup-rtk-artifacts (report only)
        run: ./bin/cleanup-rtk-artifacts.sh

      # Windows binaries carry a .exe suffix the resolver never appends. MSYS
      # path emulation covers it, but the whole point is not to assume.
      - name: run-cli-hook resolves an .exe
        if: runner.os == 'Windows'
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/bash\necho ran-stub\n' > "$HOME/.local/bin/cct-probe.exe"
          chmod +x "$HOME/.local/bin/cct-probe.exe"
          ./hooks/run-cli-hook --which cct-probe

      - name: full install (no shell wrapper)
        run: ./install.sh --no-shell-wrapper --no-caveman

      - name: installed components really landed
        run: |
          fail=0
          for b in rtk codebase-memory-mcp; do
            if p=$(./hooks/run-cli-hook --which "$b"); then
              echo "  ok   - $b → $p"
            else
              echo "  FAIL - $b not resolvable after install"; fail=1
            fi
          done
          # Guards the class of bug where the summary ticks something absent.
          exit $fail

      - name: post-install --check
        run: ./install.sh --check

      # A native Windows Claude Code is a Node process, and Node's shell-form
      # spawn uses ComSpec, so a hook can arrive at cmd.exe, which expands
      # neither `~` nor a shebang. Assert every command we installed survives
      # that spawn path as well as Git Bash. Without this the hooks silently
      # never fire on a native install.
      - name: installed hooks run under cmd.exe and Git Bash
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gitbash  = "C:\Program Files\Git\bin\bash.exe"
          $settings = "$($env:USERPROFILE -replace '\\','/')/.claude/settings.json"
          $cmds = & $gitbash -c "jq -r '[.. | objects | select(.command? != null) | .command] | .[]' '$settings'" |
                  ForEach-Object { $_.Trim() } | Where-Object { $_ }
          Write-Host "$($cmds.Count) hook command(s) installed`n"

          $fail = 0
          foreach ($c in $cmds) {
            # An unwinified command still carries `~` or a bare shebang path.
            if ($c -notmatch '^"[A-Za-z]:/[^"]*bash\.exe" "') {
              Write-Host "FAIL not pinned to an absolute bash.exe :: $c"; $fail = 1; continue
            }
            foreach ($runner in @(
              @{ n = 'cmd.exe';  b = { '{}' | cmd.exe /c $c 2>&1 } },
              @{ n = 'git bash'; b = { '{}' | & $gitbash -c $c 2>&1 } }
            )) {
              # What is under test is whether the spawn resolves, not what the
              # hook decides. A hook is entitled to a non-zero exit; 9009/127
              # and the not-recognized text mean the shell never found it.
              $out = & $runner.b | Out-String
              if ($LASTEXITCODE -in 9009, 127 -or
                  $out -match 'is not recognized|command not found|No such file') {
                Write-Host "FAIL $($runner.n) exit=$LASTEXITCODE :: $c`n  $($out.Trim())"; $fail = 1
              } else {
                Write-Host "ok   $($runner.n) exit=$LASTEXITCODE :: $c"
              }
            }
          }
          exit $fail
